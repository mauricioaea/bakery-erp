<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - PanaderíaPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recovery-container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .recovery-icon {
            font-size: 48px;
            color: #f5b81b;
            margin-bottom: 20px;
        }

        .recovery-title {
            font-size: 24px;
            font-weight: 700;
            color: #0a0e17;
            margin-bottom: 10px;
        }

        .recovery-subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .contact-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #475569;
        }

        .contact-item i {
            color: #f5b81b;
            width: 20px;
            text-align: center;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(145deg, #f5b81b, #d49a0a);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 184, 27, 0.35);
        }

        .dev-note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="recovery-container">
        <div class="recovery-icon">
            <i class="fas fa-key"></i>
        </div>

        <h1 class="recovery-title">Recuperar Contraseña</h1>
        <p class="recovery-subtitle">
            Para recuperar tu contraseña, por favor contacta al administrador del sistema.
        </p>

        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-user"></i>
                <span><strong>Administrador:</strong> Mauricio Erazo</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span><strong>Email:</strong> mauricioandreserazo@outlook.com</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <span><strong>Teléfono:</strong> 3102482881</span>
            </div>
        </div>

        <a href="{{ url_for('login') }}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Volver al Login
        </a>

        <div class="dev-note">
            ⚠️ La recuperación automática por email estará disponible en la próxima versión.
        </div>
    </div>
</body>
</html>
