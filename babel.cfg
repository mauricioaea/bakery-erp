# ============================================================
# DT-37: Configuración de extracción de strings para Flask-Babel
# ============================================================
# Este archivo le dice a pybabel DÓNDE buscar strings traducibles:
#   - [python: **.py]              → archivos .py
#   → __init__.py para reportes.py
#   - [jinja2: **/templates/**.html] → templates Jinja2
#
# Para reportes: reportes.py importa `_` desde flask_babel.
# Los strings marcados con `_("texto")` se extraen automáticamente.
#
# Uso:
#   pybabel extract -F babel.cfg -o locales/messages.pot .
#   pybabel init -i locales/messages.pot -d locales -l es
#   pybabel init -i locales/messages.pot -d locales -l en
#   pybabel compile -d locales
# ============================================================

[python: **.py]
encoding = utf-8

[jinja2: **/templates/**.html]
encoding = utf-8
extensions = jinja2.ext.autoescape,jinja2.ext.with_